name: Charts and cards

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "assets/skills.json"
      - "assets/projects.json"
      - "assets/calendar.json"
      - "assets/invaders.json"
      - "scripts/radar.py"
      - "scripts/cards.py"
      - "scripts/isocalendar.py"
      - "scripts/invaders.py"
      - ".github/workflows/radar.yml"

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Hand-authored skill radar (edit assets/skills.json to change it)
      - name: Skill radar
        run: python scripts/radar.py --data assets/skills.json -o assets/radar

      # Live radar built from real language byte counts across your repos
      - name: Language radar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/radar.py \
            --github "${{ github.repository_owner }}" \
            -o assets/radar-langs \
            --limit 7 --values --curve 0.4 \
            --exclude "shell,makefile,dockerfile,batchfile,procfile"

      # Self-hosted stat and repo cards
      - name: Stat and repo cards
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          python scripts/cards.py \
            --user "${{ github.repository_owner }}" \
            --projects assets/projects.json \
            --out assets

      # 3D Animated Isometric Calendar with building animation
      - name: 3D Isometric Calendar
        run: |
          python scripts/isocalendar.py \
            --user "${{ github.repository_owner }}" \
            --config assets/calendar.json \
            -o assets/metrics.isocalendar.svg

      # Retro Space Invaders Contribution Defense
      - name: Space Invaders Contribution Defense
        run: |
          python scripts/invaders.py \
            --user "${{ github.repository_owner }}" \
            --config assets/invaders.json \
            -o assets/invaders.svg

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/radar-*.svg assets/card-*.svg assets/metrics.isocalendar.svg assets/invaders.svg
          git diff --staged --quiet || git commit -m "chore: refresh charts, cards, calendar, and space invaders"
          git push

